# dsh-pi-tui bundle patch: the pi-tui interactive terminal front door over
# the dsh-base layer. Applied after dsh-base's insert; rows override base
# rows by id, with the profile's own cordis.patch.yml and any --patch
# overlays still to come.
#
# A patch replaces the targeted row's whole `config`, so an overriding row
# restates every key it owns. All other dsh-base rows — tools, sandbox and
# approval policy, skills, goal, plan mode, persistence, telemetry — are
# inherited unchanged, so sessions live in the shared ~/.dsh/sessions store
# alongside the web profile.

# ── surface-specific values over the dsh-base layer ─────────────────────────

# The TUI creates (or resumes) its agent at runtime through the agent
# factory; no declarative agents are started at boot.
- id: agent-loop
  config:
    agents: []

# ── dsh-pi-tui rows ─────────────────────────────────────────────────────────

- insert:
    # The interactive front door. The plugin creates/resumes its agent at
    # runtime and disposes the whole app tree (exiting the process) when
    # the TUI unmounts. `dsh --profile pi-tui --resume <session-id>`
    # reaches the plugin through ctx.cmdlineArgs.
    - id: pi-tui
      name: 'dsh-pi-tui'
      # provider/model are intentionally unset: the TUI resolves them from
      # the harness's agent-default-model selection (settings.yaml) unless
      # this row explicitly overrides them. `--resume` reaches the app
      # through ctx.cmdlineArgs.

# ── workspace grouping rows (not in dsh-base) ───────────────────────────────
#
# `dsh-workspace` (ctx.workspaceRegistry) is what groups sessions into
# workspaces by cwd, and it is a web-only row — the web bundle adds it plus
# its storage chain, so a plain dsh-base profile like pi-tui has no
# workspaceRegistry at all. The TUI creates sessions in-process through
# ctx.agents.create (bypassing the web host's attachSession), so it loads the
# same workspace service here to attach its sessions by cwd. Storage roots
# mirror the web rows exactly, so both profiles read and write the same
# workspace records under ~/.dsh.

- insert:
    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    # The agent-preset roster. dsh-base ships no preset registry; without this
    # row the TUI's --preset picker lists nothing and sessions mount no preset
    # at all. Mirrors the web profile's row so both surfaces resolve the same
    # roster and default.
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: shield-break-agent
        # This deployment's own presets only: the shipped upstream roster
        # (standard/ptc/minimal/cordis) stays out of the TUI picker.
        includeShippedRoot: false

    # The pentest control plane, mirroring the web profile's rows so both
    # surfaces drive one run store and one recon cache. The dashboards stay
    # web-only; the TUI drives these services through its /runs and /recon
    # commands.
    - id: pentest-runs
      name: '@deepseek-ai/dsh-pentest-run'

    - id: pentest-mode
      name: '@deepseek-ai/dsh-pentest-executor'

    - id: pentest-loop
      name: '@deepseek-ai/dsh-pentest-executor/loop'

    - id: recon-engine
      name: '@deepseek-ai/dsh-recon-engine'
      config:
        allowAnyTarget: true

    # Host-owned subagent model-selection settings. The standard preset's
    # delegation group mounts `tool-subagent` with `modelSelectionSettings:
    # true`, which requires this service in the Host scope; without the row
    # every preset mount fails with "2 row(s) did not activate".
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'

    # Saved SSH machines and their execution providers. Machines are stored in
    # the shared settings store, so profiles added from the Web are usable
    # here; a session whose cwd sits under /__dsh_ssh__/<machineId>/ runs on
    # that machine (see the /machines command and the --machine flag).
    - id: remote-machines
      name: '@deepseek-ai/dsh-remote-machines'

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'
