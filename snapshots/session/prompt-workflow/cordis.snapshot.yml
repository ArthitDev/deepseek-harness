# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
          - id: deepseek-messages
            name: DeepSeek Messages
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

# Keep machine-local instructions and skill libraries out of this prompt fixture.
- id: agent-instructions
  config:
    maxBytes: 65536
    instructionFileCandidates: []
    localInstructionFileCandidates: []

- id: skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs: []

- id: tool-fs-search
  config:
    sampleOverCapGlobResults: false
    knowledgeRoots: []
