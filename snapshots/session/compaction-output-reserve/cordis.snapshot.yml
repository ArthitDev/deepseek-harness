# With 1,800 tokens of headroom, a 1,000-token output reservation lowers the
# trigger from 9,200 to 8,700, between the history and its condensed replacement.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    headroomTokens: 1800
    retainTokens: 20
    maxTokens: 256

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 11500
                defaultMaxTokens: 1000

- id: agent-instructions
  config:
    maxBytes: 0
    projectRootMarkers: []
    instructionFileCandidates: []
    localInstructionFileCandidates: []
- id: skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs: []
- id: tool-fs-search
  config:
    sampleOverCapGlobResults: false
    knowledgeRoots: []
- id: tool-bash
  disabled: false
- id: bash-sandbox
  disabled: false
- id: tool-pwsh
  disabled: true
- id: pwsh-sandbox
  disabled: true
