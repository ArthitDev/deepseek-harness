# Keyless context-overflow replay composition.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.99
    retainTokens: 20
    maxTokens: 256

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 128000

# Use the recorded Bash tool set without machine-local instructions or skills.
- id: tool-bash
  disabled: false
- id: bash-sandbox
  disabled: false
- id: tool-pwsh
  disabled: true
- id: pwsh-sandbox
  disabled: true
- id: agent-instructions
  config:
    maxBytes: 0
    projectRootMarkers: []
    instructionFileCandidates: []
    localInstructionFileCandidates: []
- id: skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs: []
- id: tool-fs-search
  config:
    sampleOverCapGlobResults: false
    knowledgeRoots: []
