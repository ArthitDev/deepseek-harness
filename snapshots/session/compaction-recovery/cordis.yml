# Context-overflow composition used by the headless compaction session.

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.99
    retainTokens: 20
    maxTokens: 256

# Use the recorded Bash tool set without machine-local instructions or skills.
- id: tool-bash
  disabled: false
- id: bash-sandbox
  disabled: false
- id: tool-pwsh
  disabled: true
- id: pwsh-sandbox
  disabled: true
- id: agent-instructions
  config:
    maxBytes: 0
    projectRootMarkers: []
    instructionFileCandidates: []
    localInstructionFileCandidates: []
- id: skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs: []
- id: tool-fs-search
  config:
    sampleOverCapGlobResults: false
    knowledgeRoots: []
