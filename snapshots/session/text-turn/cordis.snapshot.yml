# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
          - id: deepseek-messages
            name: DeepSeek Messages
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

    - id: pi-tui-context-capture
      name: '../../../packages/experimental/pi-tui/tests/fixtures/context-capture.mjs'
      disabled: !!js process.env.DSH_CONTEXT_CAPTURE_TEST !== '1'

- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: !!js process.platform === 'win32' && process.env.DSH_CONTEXT_CAPTURE_TEST !== '1'

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32' && process.env.DSH_CONTEXT_CAPTURE_TEST !== '1'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32' || process.env.DSH_CONTEXT_CAPTURE_TEST === '1'

- id: pwsh-sandbox
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: !!js process.platform !== 'win32' || process.env.DSH_CONTEXT_CAPTURE_TEST === '1'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
    knowledgeRoots: !!js "process.env.DSH_CONTEXT_CAPTURE_TEST === '1' ? [] : [{ name: 'default', path: dshHomePath('knowledge'), bootstrap: true }]"

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  disabled: !!js process.env.DSH_CONTEXT_CAPTURE_TEST === '1'
